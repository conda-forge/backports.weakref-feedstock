{% set name = "backports.weakref" %}
{% set version = "1.0.post1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/backports.weakref-{{ version }}.tar.gz
  sha256: bc4170a29915f8b22c9e7c4939701859650f2eb84184aee80da329ac0b9825c2

build:
  noarch: python
  number: 1004
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
    - backports
  run:
    - python >={{ python_min }}
    - backports

test:
  requires:
    - python {{ python_min }}
  imports:
    - backports.weakref

about:
  home: https://github.com/pjdelport/backports.weakref
  license: Python-2.0
  summary: 'Backport of new features in Python''s weakref module'
  dev_url: https://github.com/pjdelport/backports.weakref

extra:
  recipe-maintainers:
    - adrianchia
